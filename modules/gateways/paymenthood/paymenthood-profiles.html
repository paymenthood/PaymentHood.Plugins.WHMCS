<!--
  PaymentHood Checkout – HTML Templates
  ======================================
  This file contains all HTML templates used by the PaymentHood checkout UI.
  Each <template> block has a unique id. The JavaScript (paymenthood-profiles.js)
  fetches this file once, parses it, and clones each template as needed.

  Placeholders use {{name}} syntax. The JS replaces them before injection.

  A front-end developer can freely edit the markup and classes here without
  touching any JavaScript.
-->

<!-- Shown while payment profiles are being fetched -->
<template id="ph-tpl-loading">
    <div class="paymenthood-profiles-loading">Loading payment methods...</div>
</template>

<!-- Shown when an error occurs ({{message}} is replaced by JS) -->
<template id="ph-tpl-error">
    <div class="paymenthood-profiles-error">{{message}}</div>
</template>

<!-- Shown when no supported payment profiles are returned -->
<template id="ph-tpl-no-profiles">
    <div class="paymenthood-profiles-error">No payment methods available</div>
</template>

<!-- Wrapper for the full profiles list (contains grid) -->
<template id="ph-tpl-profiles-wrapper">
    <div class="paymenthood-profiles-list" data-ph-list></div>
</template>

<!-- One card per payment profile. Repeated inside .paymenthood-profiles-list -->
<!-- Placeholders: {{profileId}}, {{displayName}}, {{providerName}} -->
<template id="ph-tpl-profile-item">
    <div class="paymenthood-profile-item" data-profile-id="{{profileId}}">
        <div class="paymenthood-profile-header">
            <!-- Icon slot: filled by JS only when an icon URL exists -->
            <div class="paymenthood-profile-icon" data-ph-icon-slot></div>
            <div class="paymenthood-profile-name">{{displayName}}</div>
        </div>
        <div class="paymenthood-profile-type">{{providerName}}</div>
    </div>
</template>

<!-- Icon image inserted into .paymenthood-profile-icon when available -->
<!-- Placeholders: {{proxyIconUrl}}, {{directIconUrl}}, {{alt}} -->
<template id="ph-tpl-profile-icon">
    <img data-ph-icon="1"
         src="{{proxyIconUrl}}"
         data-direct-src="{{directIconUrl}}"
         alt="{{alt}}"
         loading="eager">
</template>

<!-- Built-in card icon. Used for the CreditCard row when the API supplies no
     iconUri, and as the last resort if both the proxy and the icon's own URL
     fail. Inline SVG so it needs no network request and cannot go missing. -->
<template id="ph-tpl-profile-icon-builtin">
    <svg class="paymenthood-builtin-card" viewBox="0 0 60 40" width="60" height="40"
         role="img" aria-label="Credit card" focusable="false">
        <rect x="3.5" y="7.5" width="53" height="25" rx="3.5" fill="#ffffff" stroke="#94a3b8"/>
        <rect x="3.5" y="13" width="53" height="6" fill="#475569"/>
        <rect x="8" y="23" width="10" height="6.5" rx="1.5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.75"/>
        <rect x="22" y="26" width="14" height="2" rx="1" fill="#cbd5e1"/>
        <rect x="39" y="26" width="8" height="2" rx="1" fill="#cbd5e1"/>
    </svg>
</template>
